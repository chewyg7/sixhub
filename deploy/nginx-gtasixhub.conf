# nginx site for GTA 6 Hub, behind Cloudflare.
#
# What it does:
#   - Serves the build's static files and /public (images, models, fonts)
#     straight from disk with long cache times, so Cloudflare and browsers
#     keep them and the app only handles pages.
#   - Rate limits each visitor (by their real IP, which Cloudflare passes on).
#   - Uses a Cloudflare Origin Certificate for HTTPS between Cloudflare and
#     this server (Cloudflare SSL mode: Full (strict)).
#
# Install (see DEPLOY.md, "Cloudflare"):
#   sudo bash /srv/gtasixhub/deploy/cloudflare-setup.sh
# which writes the Cloudflare IP list, installs this file, tests and reloads
# nginx, and locks the firewall to Cloudflare.

# Requests per second per visitor: pages, and the heavier API/image routes.
limit_req_zone $binary_remote_addr zone=gh_pages:20m rate=20r/s;
limit_req_zone $binary_remote_addr zone=gh_api:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=gh_conn:10m;

map $http_upgrade $connection_upgrade_gtasixhub {
    default upgrade;
    "" "";
}

# Plain HTTP only redirects (Cloudflare normally upgrades before it gets here).
server {
    listen 80;
    listen [::]:80;
    server_name gtasixhub.com www.gtasixhub.com;
    include /etc/nginx/snippets/cloudflare-real-ip.conf;
    return 301 https://gtasixhub.com$request_uri;
}

server {
    # (nginx 1.24 syntax; on 1.25+ this can become "listen 443 ssl;" plus "http2 on;")
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gtasixhub.com www.gtasixhub.com;

    ssl_certificate     /etc/ssl/cloudflare/gtasixhub.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/gtasixhub.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # The visitor's real address from Cloudflare (for rate limits, logs and the app's login throttle).
    include /etc/nginx/snippets/cloudflare-real-ip.conf;
    # Refuse anything that didn't come through Cloudflare (direct hits on the server's IP).
    include /etc/nginx/snippets/gtasixhub-cloudflare-only.conf;

    if ($host = www.gtasixhub.com) {
        return 301 https://gtasixhub.com$request_uri;
    }

    limit_req_status 429;
    limit_conn_status 429;
    limit_conn gh_conn 60;
    # Admin forms; file uploads have their own location below.
    client_max_body_size 25m;
    # (Set here, not in the shared proxy snippet, so the upload location can override it.)
    proxy_read_timeout 120s;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml model/gltf+json font/ttf font/otf application/manifest+json;

    # Build output: file names change with every build, so they're cached for good.
    location /_next/static/ {
        alias /srv/gtasixhub/.next/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        access_log off;
        try_files $uri =404;
    }

    # Files in /public (archive images, the plate tool's models and fonts, hero art…).
    # Served from disk; anything not there falls through to the app.
    location ~ ^/(media|tools|vi-text|hero|brand|pwa)/ {
        root /srv/gtasixhub/public;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        add_header X-Content-Type-Options nosniff;
        access_log off;
        try_files $uri @app;
    }

    # Admin uploads: big files arrive in 48 MB pieces (Cloudflare's limit is 100 MB per request).
    location /chewy/api/upload {
        client_max_body_size 80m;
        proxy_request_buffering off;
        proxy_read_timeout 15m;
        proxy_send_timeout 15m;
        limit_req zone=gh_api burst=40 nodelay;
        include /etc/nginx/snippets/gtasixhub-proxy.conf;
    }

    # Heavier routes: search index, news, share images, short links.
    location ~ ^/(api|og|go)/ {
        limit_req zone=gh_api burst=20 nodelay;
        include /etc/nginx/snippets/gtasixhub-proxy.conf;
    }

    location / {
        limit_req zone=gh_pages burst=80 nodelay;
        include /etc/nginx/snippets/gtasixhub-proxy.conf;
    }

    location @app {
        limit_req zone=gh_pages burst=80 nodelay;
        include /etc/nginx/snippets/gtasixhub-proxy.conf;
    }
}
