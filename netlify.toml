# Netlify detects Next.js and configures the build and server runtime itself.

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

# Trailer 1 is hosted without CORS headers, so it has to be served from this
# origin for frame capture and pixel tools to work. Locally that is
# app/api/video/[slug]/route.ts; on Netlify the edge proxies the file
# directly instead, because functions cap response time and size.
[[redirects]]
  from = "/api/video/gta-vi-trailer-1"
  to = "https://cdn.invincible25.com/GTAVI_Trailer1.mp4"
  status = 200
  force = true
