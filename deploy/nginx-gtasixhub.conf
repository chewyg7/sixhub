# nginx site for GTA 6 Hub, for servers where nginx already runs other sites.
# Install:
#   cp deploy/nginx-gtasixhub.conf /etc/nginx/sites-available/gtasixhub
#   ln -s /etc/nginx/sites-available/gtasixhub /etc/nginx/sites-enabled/gtasixhub
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d gtasixhub.com -d www.gtasixhub.com   (adds HTTPS to this file)

server {
    listen 80;
    listen [::]:80;
    server_name gtasixhub.com www.gtasixhub.com;

    # Large enough for video uploads from the admin panel (6 GB), streamed
    # straight to the app instead of buffered on disk first.
    client_max_body_size 6G;
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # nginx appends the real client address; the app reads the last entry
        # for login rate limiting (TRUSTED_PROXY_HOPS=1).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_gtasixhub;
        proxy_read_timeout 15m;
        proxy_send_timeout 15m;
    }
}

map $http_upgrade $connection_upgrade_gtasixhub {
    default upgrade;
    "" "";
}
