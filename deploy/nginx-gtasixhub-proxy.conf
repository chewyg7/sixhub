# Shared proxy settings for the GTA 6 Hub app (installed as /etc/nginx/snippets/gtasixhub-proxy.conf).
proxy_pass http://127.0.0.1:3100;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto https;
# $remote_addr is the visitor (Cloudflare's address replaced by the real one), so
# the last X-Forwarded-For entry is the visitor; the app reads it for its login
# throttle (TRUSTED_PROXY_HOPS=1).
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade_gtasixhub;
