<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0910" />
    <title>You're offline · GTA 6 Hub</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0910;
        color: #f2eef6;
        font-family: system-ui, -apple-system, sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
        background: radial-gradient(60% 50% at 50% 100%, rgb(255 79 163 / 0.25), transparent 70%), #0b0910;
      }
      img {
        width: 88px;
        height: 88px;
        border-radius: 22px;
      }
      h1 {
        margin: 24px 0 8px;
        font-size: 28px;
      }
      p {
        margin: 0 auto;
        max-width: 320px;
        line-height: 1.5;
        color: rgb(242 238 246 / 0.65);
      }
      button {
        margin-top: 24px;
        height: 48px;
        padding: 0 24px;
        border: 0;
        border-radius: 999px;
        background: linear-gradient(100deg, #e445b8, #ff4fa3 45%, #ff8a73);
        color: #fff;
        font-size: 16px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa/icon-192.png" alt="GTA 6 Hub" />
      <h1>You're offline</h1>
      <p>GTA 6 Hub needs a connection. Check your signal or Wi-Fi and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
